<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CodeHarness OJ{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="/">CodeHarness <span>OJ</span></a>
      <nav aria-label="Primary navigation">
        <a href="/problems">Problems</a>
        {% if current_user %}
          <a href="/settings">Settings</a>
          {% if current_user.role.value == 'admin' %}<a href="/admin">Admin</a>{% endif %}
          <form class="inline" action="/logout" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="link-button" type="submit">Log out</button>
          </form>
        {% else %}
          <a href="/login">Log in</a>
          <a class="nav-cta" href="/register">Register</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container page">
    {% if flash %}
      <div class="alert alert-{{ flash.category }}" role="status">{{ flash.message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="container footer">
    <span>CodeHarness OJ · Phase 1</span>
  </footer>
</body>
</html>

{% extends "base.html" %}
{% block title %}Register · CodeHarness OJ{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="form-card">
    <p class="eyebrow">NEW ACCOUNT</p>
    <h1>Register</h1>
    <p class="muted">Create a user account. Administrator access is granted only through the operator CLI.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Username<input name="username" value="{{ username or '' }}" autocomplete="username" required minlength="3" maxlength="40"></label>
      <label>Email<input name="email" type="email" value="{{ email or '' }}" autocomplete="email" required maxlength="320"></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="10"></label>
      <label>Confirm password<input name="password_confirm" type="password" autocomplete="new-password" required minlength="10"></label>
      <button class="button full" type="submit">Create account</button>
    </form>
    <p class="form-footer">Already registered? <a href="/login">Log in</a>.</p>
  </div>
</div>
{% endblock %}

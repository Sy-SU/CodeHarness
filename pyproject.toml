[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "codeharness"
version = "0.1.0"
description = "An experimental coding-agent harness and online judge."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
codeharness-oj = "oj.server.main:run"
codeharness-admin = "oj.server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["oj", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["oj"]


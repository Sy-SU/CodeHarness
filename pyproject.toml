[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "codeharness"
version = "0.1.0"
description = "A macOS coding-agent harness for remote MiniOJ experiments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]
dashboard = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "uvicorn>=0.30,<1",
]

[project.scripts]
codeharness-agent = "agent.cli:main"
codeharness-model-client = "agent.models.cli:main"
codeharness-oj-client = "agent.oj_client.cli:main"
codeharness-report = "experiments.summarize:main"
codeharness-experiment = "experiments.cli:main"
codeharness-dashboard = "dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "experiments", "dashboard"]

[tool.hatch.build.targets.sdist]
exclude = ["/config/models.yaml", "/config/harness.yaml", "/config/* copy.yaml", "/config/*.local.yaml"]
include = [
  "/.env.example",
  "/.gitignore",
  "/README.md",
  "/README_zh.md",
  "/TODO.md",
  "/STATUS.md",
  "/agent",
  "/client_tests",
  "/config",
  "/docs",
  "/dashboard",
  "/experiments",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["client_tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agent", "experiments"]
